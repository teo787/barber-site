<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Explicit Barber</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #fff;
    }
    header {
      background-color: #000;
      padding: 1em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }
    header img.logo {
      height: 50px;
    }
    nav a {
      color: white;
      margin-left: 1em;
      text-decoration: none;
    }
    .hero {
      background: url('banner.jpg') no-repeat center center/cover;
      text-align: center;
      color: black;
      padding: 4em 1em;
    }
    .hero img {
      max-width: 200px;
    }
    .hero h1 {
      font-size: 2em;
      margin: 0.5em 0;
    }
    .hero p {
      font-size: 1em;
      opacity: 0.8;
    }
    .cta-button {
      background-color: #000;
      color: white;
      padding: 0.8em 1.5em;
      border: none;
      margin-top: 1em;
      cursor: pointer;
    }
    .contact-section {
      text-align: center;
      padding: 2em 1em;
    }
    .phone-box {
      border: 2px solid #900;
      border-radius: 20px;
      padding: 2em;
      display: inline-block;
      font-size: 2em;
      color: #000;
      margin-bottom: 2em;
    }
    .map {
      width: 100%;
      height: 300px;
      background: url('map_placeholder.png') no-repeat center center/cover;
    }
    footer {
      background-color: #eee;
      text-align: center;
      padding: 1.5em 1em;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" class="logo" alt="Logo Explicit">
    <nav>
      <a href="#">INICIO</a>
      <a href="#">MEMBRESIA</a>
      <a href="#">EXPLICIT STORE</a>
      <a href="#">CONTACTO</a>
      <a href= "#">BARBERS</a>
    </nav>
  </header>

  <section class="hero">
    <img src="explicit-logo.png" alt="Explicit Logo">
    <h1>BIENVENIDO A EXPLICIT BARBER</h1>
    <p>DONDE TENEMOS EL MEJOR SERVICIO</p>
    <button class="cta-button">RESERVA EN LÍNEA</button>
  </section>
<div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1667.1366250249293!2d-75.44446713552102!3d6.375731341037127!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e443b4f3c71a605%3A0xff1f6f2b77baee18!2sExplicit%20Barber%20Shop!5e0!3m2!1ses-419!2sco!4v1754003570957!5m2!1ses-419!2sco" 
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
 <footer>
    <p>Todos los derechos reservados EXPLICIT BARBER &copy; 2025</p>
  </footer>
</body>
</html>
