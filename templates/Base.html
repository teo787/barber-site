{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
 
  <meta charset="UTF-8">
  <title>{% block title %}Explicit Barber{% endblock%}</title>
  <link rel="stylesheet" href="{% static 'Barberia/css/styles.css' %}">
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #fff;
    }
    header {
      background-color: #061e2eff;
      padding: 1em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }
    header img.logo {
      height: 50px;
    }
    nav a {
      color: white;
      margin-left: 1em;
      text-decoration: none;
    }
    .hero {
      background: url('banner.jpg') no-repeat center center/cover;
      text-align: center;
      color: black;
      padding: 4em 1em;
    }
    .hero img {
      max-width: 200px;
    }
    .hero h1 {
      font-size: 2em;
      margin: 0.5em 0;
    }
    .hero p {
      font-size: 1em;
      opacity: 0.8;
    }
    .cta-button {
      background-color: #061e2eff;
      color: white;
      padding: 0.8em 1.5em;
      border-radius: 15px;
      border-color: #ffffffff;
      margin-top: 1em;
      cursor: pointer;
    }
    .cta-button:hover{
      background-color: #174b6eff;
    }
    .contact-section {
      text-align: center;
      padding: 2em 1em;
    }
    .phone-box {
      border: 2px solid #900;
      border-radius: 20px;
      padding: 2em;
      display: inline-block;
      font-size: 2em;
      color: #000;
      margin-bottom: 2em;
    }
    .map {
      width: 100%;
      height: 300px;
      background: url('map_placeholder.png') no-repeat center center/cover;
    }
    footer {
      background-color: #eee;
      text-align: center;
      padding: 1.5em 1em;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  
  <header>
    <img src= "{% static 'Barberia/Imagenes/LOGO.png' %}" alt="Explicit Logo" class="Logo-header">
    
    <nav>
      <a href="http://127.0.0.1:8000/">INICIO</a>
      <a href="/Membresia">MEMBRESIA</a>
      <a href="https://www.instagram.com/explicit.store31?utm_source=ig_web_button_share_sheet&igsh=MThtdGlraDZneW9taA==">EXPLICIT STORE</a>
      <a href= "/Barbers">BARBERS</a>
    </nav>
    </header>
  
{% block content %}{% endblock%}
  <footer>
    <p>Todos los derechos reservados EXPLICIT BARBER &copy; 2025</p>
  </footer>
<script src="{% static 'Barberia/js/Carrusel.js' %}"></script>
</body>
</html>
